name: CI

on:
  push:
    branches: [develop, epic, main]
  pull_request:
    branches: [develop, epic, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pinpoint_test
          POSTGRES_USER: pinpoint
          POSTGRES_PASSWORD: pinpoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgres://pinpoint:pinpoint@localhost:5432/pinpoint_test

      - name: Run tests
        run: npm test
        env:
          AUTH_SECRET: test-secret
          DATABASE_URL: postgres://pinpoint:pinpoint@localhost:5432/pinpoint_test
          REDIS_URL: redis://localhost:6379
